name: Android CI Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # यह नया एक्शन m4rth/kivy-build-action है
      - name: Build Kivy APK
        uses: m4rth/kivy-build-action@v2 
        id: build_apk
        with:
          # यह buildozer.spec का उपयोग करेगा
          build-target: android debug

      # APK Artifact को अपलोड करें
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kivy-Android-APK
          path: ${{ steps.build_apk.outputs.apk-path }}
